    <h1>Pier 1</h1>
    <div class="essays" data-gallery>
<figure class="essay"><button class="essay-open" type="button" data-full="media/uploads/2022/03/68-SH2-232Mosaic-1.jpg"><img src="media/uploads/2022/03/68-SH2-232Mosaic-1.jpg" alt="Sharpless 232 in Auriga"></button><figcaption><h2>Sharpless 232 in Auriga</h2><p>The diffuse nebula is massive, the biggest in the Auriga nebula complex, but it is very faint and hard to capture. Hundreds of subexposures were used to try to bring out its dusty detail and dim contrast. Only the Hydrogen and Sulphur channels shine; Oxygen contributed to the star colors.</p></figcaption></figure>
<figure class="essay"><button class="essay-open" type="button" data-full="media/uploads/2022/03/69-NGC4631Galaxy.jpg"><img src="media/uploads/2022/03/69-NGC4631Galaxy.jpg" alt="The Whale Galaxy"></button><figcaption><h2>The Whale Galaxy</h2><p>This interesting edge-on galaxy in Canes Venatici looks a bit like a whale with its pup underneath. Of particular note is its off-center starburst region, and it’s a good fit to be number 281 in Arp’s list of unusual galaxies. The nearby colliding Hockey Stick galaxies can be seen in the upper right of this image.</p></figcaption></figure>
<figure class="essay"><button class="essay-open" type="button" data-full="media/uploads/2022/03/70-NGC1499-California-1.jpg"><img src="media/uploads/2022/03/70-NGC1499-California-1.jpg" alt="The California Nebula in Blue"></button><figcaption><h2>The California Nebula in Blue</h2><p>This nebula is found just ‘above’ the Seven Sisters of the Pleiades in Perseus. When processing the almost pure hydrogen glow, image processors must choose which color to make it, and we chose a cooler blue and purple rendering over the traditional pink and red this time.</p></figcaption></figure>
<figure class="essay"><button class="essay-open" type="button" data-full="media/uploads/2022/03/71A-NGC6992-BlueRed-1-e1646430875551.jpg"><img src="media/uploads/2022/03/71A-NGC6992-BlueRed-1-e1646430875551.jpg" alt="The Eastern Veil in Red &amp; Blue"></button><figcaption><h2>The Eastern Veil in Red &amp; Blue</h2><p>Part of a much larger nebulous complex in Cygnus, the Eastern Veil features delicate wisps of glowing hydrogen and oxygen, the remnants of an exploding star that may someday seed a new planetary system with raw ingredients.</p></figcaption></figure>
<figure class="essay"><button class="essay-open" type="button" data-full="media/uploads/2022/03/71B-NGC6992-BlueGold-1-e1646430848638.jpg"><img src="media/uploads/2022/03/71B-NGC6992-BlueGold-1-e1646430848638.jpg" alt="The Veil Nebula in Blue and Gold"></button><figcaption><h2>The Veil Nebula in Blue and Gold</h2><p>When choosing narrowband palettes to highlight specific wavelengths, sometimes the traditional choices aren’t necessarily the best. This blend of the Veil jumped out to us with a thin spine of green over the electric blue and mainly gold structures.</p></figcaption></figure>
<figure class="essay"><button class="essay-open" type="button" data-full="media/uploads/2022/03/72-OrionM42-1.jpg"><img src="media/uploads/2022/03/72-OrionM42-1.jpg" alt="The Orion Nebula"></button><figcaption><h2>The Orion Nebula</h2><p>How did the most famous and easily viewed nebula drop all the way down to number 42 on Charles Messier’s famous list of non-comets? This new view of the classic target shows our sharpest dust features yet.</p></figcaption></figure>
<figure class="essay"><button class="essay-open" type="button" data-full="media/uploads/2022/03/73-M63Galaxy.jpg"><img src="media/uploads/2022/03/73-M63Galaxy.jpg" alt="The Sunflower Galaxy"></button><figcaption><h2>The Sunflower Galaxy</h2><p>Messier 63, sometimes called the Sunflower Galaxy, is known as a ‘flocculent’ galaxy, a structure without well defined spiral arms. In these unusual arms, astronomers look for data about star formation.</p></figcaption></figure>
<figure class="essay"><button class="essay-open" type="button" data-full="media/uploads/2022/03/74-NinePanelMosaic-1.jpg"><img src="media/uploads/2022/03/74-NinePanelMosaic-1.jpg" alt="The Heart of the Swan"></button><figcaption><h2>The Heart of the Swan</h2><p>This massive 9 panel mosaic features the immense field of nebulosity in Cygnus constellation. It took dozens of hours to register and align the panels in place, and the final working file was almost 10 GB in size.</p></figcaption></figure>
<figure class="essay"><button class="essay-open" type="button" data-full="media/uploads/2022/03/75-NGC6823-1.jpg"><img src="media/uploads/2022/03/75-NGC6823-1.jpg" alt="Nebula in the Open Cluster"></button><figcaption><h2>Nebula in the Open Cluster</h2><p>The field of glowing hydrogen lies among an open cluster grouping of stars. It has a prominent and recognizable pillar, similar to the famous Pillars of Creation and the Spire in M16.</p></figcaption></figure>
